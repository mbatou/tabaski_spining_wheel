<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" aria-hidden="true">
  <!-- Placeholder for the official penguin PNG. Drop the real PNG at public/penguin.png and update the <img src> in components/Wheel.tsx + Topbar.tsx if you change the filename. -->
  <!-- Penguin body -->
  <ellipse cx="100" cy="200" rx="70" ry="78" fill="#0A0A0A"/>
  <ellipse cx="100" cy="220" rx="42" ry="52" fill="#FFFFFF"/>
  <!-- Eyes -->
  <circle cx="82" cy="160" r="9" fill="#FFFFFF"/>
  <circle cx="118" cy="160" r="9" fill="#FFFFFF"/>
  <circle cx="82" cy="160" r="3" fill="#0A0A0A"/>
  <circle cx="118" cy="160" r="3" fill="#0A0A0A"/>
  <!-- Beak -->
  <path d="M88 175 L100 188 L112 175 L100 182 Z" fill="#F3A21C"/>
  <!-- Feet -->
  <ellipse cx="78" cy="276" rx="14" ry="6" fill="#F3A21C"/>
  <ellipse cx="122" cy="276" rx="14" ry="6" fill="#F3A21C"/>
  <!-- Wings -->
  <ellipse cx="38" cy="200" rx="14" ry="40" fill="#0A0A0A" transform="rotate(-20 38 200)"/>
  <ellipse cx="162" cy="200" rx="14" ry="40" fill="#0A0A0A" transform="rotate(20 162 200)"/>
  <!-- Basket -->
  <ellipse cx="100" cy="100" rx="80" ry="22" fill="#1DC8FF"/>
  <ellipse cx="100" cy="92" rx="80" ry="22" fill="#FFE89A"/>
  <!-- Veggies -->
  <circle cx="70" cy="80" r="12" fill="#4749D5"/>
  <ellipse cx="100" cy="78" rx="14" ry="10" fill="#F3A21C"/>
  <circle cx="130" cy="80" r="12" fill="#7A1B3D"/>
  <path d="M60 70 l4 -16 l3 16" stroke="#0A0A0A" stroke-width="1.5" fill="none"/>
</svg>
